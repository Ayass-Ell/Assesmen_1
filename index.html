<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" 
  content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<title>RENTAL PS - ADMIN</title>
</head>

<body><div class="d-flex">
<div class="sidebar flex-shrink-0">
  <div class="brand">RENTAL PS - ADMIN</div>
  <nav class="nav flex-column">
    <a class="nav-link active" href="index.html">Master Unit PS</a>
    <a class="nav-link " href="transaksi.html">Transaksi Sewa</a>
  </nav>
</div>

<!--Form tabel-->
<div class="flex-grow-1 d-flex flex-column">
  <div class="bg-white shadow-sm p-3">
    <h5 class="m-0">Manajemen Master Unit PlayStation</h5></div>
  <div class="p-4 flex-grow-1">

    <div class="d-flex justify-content-between align-items-center mb-3">
      <span class="text-muted">Kelola daftar unit console PlayStation, tarif sewa per jam, dan status ketersediaan.</span>
      <button id="btnTambah" class="btn btn-primary">+ Tambah Unit PS</button>
    </div>

    <div class="card shadow-sm">
      <div class="card-header bg-white d-flex justify-content-between">
        <span class="card-header-biru">Daftar Unit PlayStation</span>
        <button id="btnRefresh" class="btn btn-sm btn-outline-secondary">Refresh Data</button>
      </div>

      <div class="table-responsive">
        <table class="table table-hover mb-0 align-middle">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Nama Unit</th>
              <th>Tipe Console</th>
              <th>Harga / Jam</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="tbodyUnit"></tbody>
        </table>
      </div>
    </div>
  </div>
    <!-- End of table form-->

  <!--Footer-->
  <footer class="text-center p-3">RENTAL PS &copy; MASTER UNIT</footer>
</div>
</div>

<!--Button add unit-->
<div class="modal fade" id="modalUnit" tabindex="-1">
  <div class="modal-dialog">
    <form class="modal-content" id="formUnit">
  <div class="modal-header bg-biru">
    <h5 class="modal-title" id="judulModal">Tambah Unit PS Baru</h5>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal">
    </button>
  </div>

<!--modal form input Unit PS-->
  <div class="modal-body">
    <input type="hidden" id="idUnit">

    <div class="mb-3">
      <label class="form-label fw-semibold">Nama Unit <span class="text-danger">*</span></label>
      <input type="text" id="namaUnit" class="form-control" placeholder="PS5 - Room VIP 3" required></div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Tipe Console <span class="text-danger">*</span>
      </label>
      <select id="tipePs" class="form-select" required>
        <option value="PS5">PlayStation 5 (PS5)</option>
        <option value="PS4">PlayStation 4 (PS4)</option>
        <option value="PS3">PlayStation 3 (PS3)</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold">Harga Sewa / Jam (Rp) <span class="text-danger">*</span>
    </label>
      <input type="number" id="harga" class="form-control" min="0" placeholder="15000" required>
    </div>


    <div class="mb-3"><label class="form-label fw-semibold">Status Unit</label>
      <select id="status" class="form-select">
        <option value="Tersedia">Tersedia</option>
        <option value="Disewa">Disewa</option>
      </select>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
    <button type="submit" id="btnSimpan" class="btn btn-primary">Simpan Unit</button>
  </div>

</form>
</div>
</div>

<!--Link JS api dan Bootstrap-->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/api.js"></script>
<script src="js/unit.js"></script>
</body>
</html>
